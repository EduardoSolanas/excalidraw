name: Teacher Playground Excalidraw release

on:
  pull_request:
  push:
    branches:
      - "**"
    tags:
      - "teacher-playground-v*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Enable Corepack
        run: corepack enable
      - name: Install locked dependencies
        run: yarn install --frozen-lockfile --non-interactive
      - name: Typecheck
        run: yarn test:typecheck
      - name: Lint and formatting
        run: |
          yarn test:code
          yarn test:other
      - name: Release assembly tests
        run: yarn test:teacher-playground-release
      - name: Build package
        run: yarn build:package

  release:
    if: startsWith(github.ref, 'refs/tags/teacher-playground-v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Enable Corepack
        run: corepack enable
      - name: Install locked dependencies
        run: yarn install --frozen-lockfile --non-interactive
      - name: Build and prepare release bundle
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: yarn release:teacher-playground --tag "$RELEASE_TAG"
      - name: Upload release bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: teacher-playground-excalidraw-${{ github.ref_name }}
          path: release/cdn
          if-no-files-found: error
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#teacher-playground-v}"
          gh release create "$GITHUB_REF_NAME" \
            "release/cdn/releases/$version/package.tgz" \
            "release/cdn/releases/$version/SHA256SUMS" \
            "release/cdn/releases/$version/manifest.json" \
            release/cdn/latest.json \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
      - name: Upload versioned release to Cloudflare R2
        if: startsWith(github.ref, 'refs/tags/teacher-playground-v')
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$R2_BUCKET" ]; then
            echo "R2 secrets are not configured; skipping upload."
            exit 0
          fi
          version="${GITHUB_REF_NAME#teacher-playground-v}"
          endpoint="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 sync "release/cdn/releases/$version" "s3://$R2_BUCKET/releases/$version" \
            --endpoint-url "$endpoint" \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp release/cdn/latest.json "s3://$R2_BUCKET/latest.json" \
            --endpoint-url "$endpoint" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "application/json"
