name: Teacher Playground Excalidraw validation

on:
  pull_request:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.x
      - name: Install Yarn 1.22.22
        run: npm install --global yarn@1.22.22 --no-fund --no-audit
      - name: Install locked dependencies
        run: node scripts/yarn-install-quiet.mjs install --silent --frozen-lockfile --non-interactive
      - name: Typecheck
        run: yarn test:typecheck
      - name: Lint and formatting
        run: |
          yarn test:code
          yarn test:other
      - name: Release assembly tests
        run: yarn test:teacher-playground-release
      - name: Build package
        run: yarn build:package
