name: Teacher Playground Excalidraw release

on:
  push:
    tags:
      - "teacher-playground-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Teacher Playground version to upload (for example 0.18.1-tp.2)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Enable Corepack
        run: corepack enable
      - name: Install locked dependencies
        run: yarn install --frozen-lockfile --non-interactive
      - name: Typecheck
        run: yarn test:typecheck
      - name: Lint and formatting
        run: |
          yarn test:code
          yarn test:other
      - name: Release assembly tests
        run: yarn test:teacher-playground-release
      - name: Build package
        run: yarn build:package

  release:
    if: startsWith(github.ref, 'refs/tags/teacher-playground-v')
    needs: validate
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Enable Corepack
        run: corepack enable
      - name: Install locked dependencies
        run: yarn install --frozen-lockfile --non-interactive
      - name: Build and prepare release bundle
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: yarn release:teacher-playground --tag "$RELEASE_TAG"
      - name: Upload release bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: teacher-playground-excalidraw-${{ github.ref_name }}
          path: release/cdn
          if-no-files-found: error
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#teacher-playground-v}"
          gh release create "$GITHUB_REF_NAME" \
            "release/cdn/releases/$version/package.tgz" \
            "release/cdn/releases/$version/SHA256SUMS" \
            "release/cdn/releases/$version/manifest.json" \
            release/cdn/latest.json \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

  publish-r2:
    if: startsWith(github.ref, 'refs/tags/teacher-playground-v')
    needs: release
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Download release bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: teacher-playground-excalidraw-${{ github.ref_name }}
          path: release/cdn
      - name: Upload versioned release to Cloudflare R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          version="${GITHUB_REF_NAME#teacher-playground-v}"
          node scripts/teacher-playground-r2-upload.mjs \
            --directory release/cdn \
            --version "$version"

  recover-r2:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
    steps:
      - name: Validate release version
        id: validate
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-tp\.[0-9]+$ ]]; then
            echo "version must match x.y.z-tp.n" >&2
            exit 1
          fi
          release_tag="teacher-playground-v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.validate.outputs.release_tag }}
      - name: Verify existing GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.validate.outputs.release_tag }}
        run: gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Enable Corepack
        run: corepack enable
      - name: Install locked dependencies
        run: yarn install --frozen-lockfile --non-interactive
      - name: Rebuild exact release bundle
        env:
          RELEASE_TAG: ${{ steps.validate.outputs.release_tag }}
        run: yarn release:teacher-playground --tag "$RELEASE_TAG"
      - name: Upload versioned release to Cloudflare R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          VERSION: ${{ steps.validate.outputs.version }}
        run: |
          node scripts/teacher-playground-r2-upload.mjs \
            --directory release/cdn \
            --version "$VERSION"
